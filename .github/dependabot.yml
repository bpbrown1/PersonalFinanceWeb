version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
